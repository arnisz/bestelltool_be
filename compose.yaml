name: resource   # Volume-Präfix -> resource_pgdata (siehe resetdb.bat)

# Beide Postgres-Dienste MÜSSEN dieselbe Minor-Version verwenden wie die
# bisherige Testdatenbank auf dem Raspberry Pi. Vor dem ersten Start prüfen:
#   psql -h <pi-host> -U <user> -d postgres -c "SHOW server_version;"
x-postgres-image: &postgres-image postgres:17.10

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://dev:dev@db:5432/resource?sslmode=disable
      AUTH_STATIC_TOKENS: ${AUTH_STATIC_TOKENS:?AUTH_STATIC_TOKENS fehlt - siehe .env.example}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt - muss Base64-kodiert 32 Byte ergeben}
      RUN_MIGRATIONS: "true"
      HTTP_ADDR: ":8080"
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      PRINCIPAL_CACHE_TTL: ${PRINCIPAL_CACHE_TTL:-30s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:                       # NIEMALS db-test - das aktiviert das test-Profil
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:                           # persistent, Port 5432
    image: *postgres-image
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: resource
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d resource"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db-test:                      # ephemer (RAM), Port 5433, nur mit --profile test
    image: *postgres-image
    profiles: ["test"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: resource_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off",
       "-c", "synchronous_commit=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d resource_test"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 15s

volumes:
  pgdata: